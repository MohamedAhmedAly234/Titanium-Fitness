<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome | Redem Ea</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0b0b0b, #111);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animation Container */
    .content {
      text-align: center;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeSlideIn 1.2s ease forwards;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2.5rem;
      color: gold;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    p {
      margin-top: 12px;
      font-size: 1.1rem;
      color: #ccc;
    }

    .btn {
      margin-top: 25px;
      padding: 12px 28px;
      font-size: 1rem;
      background: linear-gradient(90deg, gold, #f0b000);
      color: #111;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,215,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(255,215,0,0.5);
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Welcome to Titanium Fitness</h1>
    <p>You’ve successfully logged in! Train Hard. Stay Strong.</p>
    <button class="btn" onclick="window.location.href='index.html'">Go To The Web</button>
  </div>
</body>
</html>
