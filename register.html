<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Register</title>
<style>
  /* خفيف منسق */
  body{font-family:Arial,Helvetica,sans-serif;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .card{width:360px;padding:28px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));box-shadow:0 8px 30px rgba(0,0,0,0.6);border:1px solid rgba(255,215,0,0.08)}
  h2{color:#ffd966;text-align:center;margin-bottom:8px}
  .hint{color:#cfcfcf;text-align:center;margin-bottom:18px;font-size:0.9rem}
  label{display:block;font-size:0.85rem;margin-bottom:6px;color:#ddd}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff;margin-bottom:12px;outline:none}
  .btn{width:100%;padding:10px;border-radius:8px;border:none;background:linear-gradient(90deg,#ffd966,#f0b000);color:#111;font-weight:700;cursor:pointer}
  .msg{margin-top:12px;padding:10px;border-radius:8px;display:none}
  .msg.success{background:rgba(40,120,40,0.12);color:#bff0b7;border:1px solid rgba(40,120,40,0.18)}
  .msg.error{background:rgba(160,40,40,0.08);color:#ffbdbd;border:1px solid rgba(255,80,80,0.12)}
  .small{font-size:0.85rem;color:#ccc;text-align:center;margin-top:10px}
  a.link{color:#ffd966;text-decoration:none;font-weight:600}
</style>
</head>
<body>

<div class="card">
  <h2>Create Account</h2>
  <div class="hint">Register with Gmail, choose a password & UID</div>

  <label for="email">Gmail</label>
  <input id="email" type="email" placeholder="you@gmail.com" autocomplete="email">

  <label for="password">Password</label>
  <input id="password" type="password" placeholder="At least 6 chars">

  <label for="uid">UID</label>
  <input id="uid" type="text" placeholder="Choose a short UID">

  <button id="registerBtn" class="btn">Register</button>

  <div id="msg" class="msg" role="alert"></div>

  <div class="small">Already have an account? <a class="link" href="login.html">Sign in</a></div>
</div>

<script>
/*
  Simple local register:
  - store users under localStorage key "tf_users" as array of objects:
    { email, uid, passHash }
  - passHash is SHA-256 hex using SubtleCrypto
*/

// util: sha256 -> hex
async function sha256Hex(message) {
  const enc = new TextEncoder();
  const data = enc.encode(message);
  const hash = await crypto.subtle.digest('SHA-256', data);
  const bytes = Array.from(new Uint8Array(hash));
  return bytes.map(b => b.toString(16).padStart(2,'0')).join('');
}

function loadUsers() {
  try {
    const raw = localStorage.getItem('tf_users');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function saveUsers(users) { localStorage.setItem('tf_users', JSON.stringify(users)); }

const emailInput = document.getElementById('email');
const passInput  = document.getElementById('password');
const uidInput   = document.getElementById('uid');
const btn = document.getElementById('registerBtn');
const msg = document.getElementById('msg');

function showMessage(text, type='error') {
  msg.textContent = text;
  msg.className = 'msg ' + (type === 'success' ? 'success' : 'error');
  msg.style.display = 'block';
}

btn.addEventListener('click', async () => {
  msg.style.display = 'none';
  const email = emailInput.value.trim().toLowerCase();
  const pass  = passInput.value;
  const uid   = uidInput.value.trim();

  // validation
  if (!email || !pass || !uid) { showMessage('Please fill all fields'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMessage('Invalid email'); return; }
  if (pass.length < 6) { showMessage('Password must be at least 6 chars'); return; }
  if (uid.length < 2) { showMessage('UID too short'); return; }

  const users = loadUsers();
  if (users.some(u => u.email === email)) { showMessage('Email already registered'); return; }
  if (users.some(u => u.uid === uid)) { showMessage('UID already taken'); return; }

  // hash password
  showMessage('Creating account...', 'success');
  try {
    const hash = await sha256Hex(pass);
    users.push({ email, uid, passHash: hash, created: Date.now() });
    saveUsers(users);
    showMessage('Account created! Redirecting to login...', 'success');
    setTimeout(() => { window.location.href = 'login.html'; }, 1100);
  } catch (e) {
    console.error(e);
    showMessage('Unexpected error, try again');
  }
});
</script>

</body>
</html>
