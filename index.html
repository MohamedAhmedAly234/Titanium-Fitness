<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .card{width:360px;padding:28px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));box-shadow:0 8px 30px rgba(0,0,0,0.6);border:1px solid rgba(255,215,0,0.08)}
  h2{color:#ffd966;text-align:center;margin-bottom:8px}
  label{display:block;font-size:0.85rem;margin-bottom:6px;color:#ddd}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#fff;margin-bottom:12px;outline:none}
  .btn{width:100%;padding:10px;border-radius:8px;border:none;background:linear-gradient(90deg,#ffd966,#f0b000);color:#111;font-weight:700;cursor:pointer}
  .msg{margin-top:12px;padding:10px;border-radius:8px;display:none}
  .msg.success{background:rgba(40,120,40,0.12);color:#bff0b7;border:1px solid rgba(40,120,40,0.18)}
  .msg.error{background:rgba(160,40,40,0.08);color:#ffbdbd;border:1px solid rgba(255,80,80,0.12)}
  .small{font-size:0.85rem;color:#ccc;text-align:center;margin-top:10px}
  a.link{color:#ffd966;text-decoration:none;font-weight:600}
</style>
</head>
<body>

<div class="card">
  <h2>Sign In</h2>

  <label for="email">Gmail</label>
  <input id="email" type="email" autocomplete="username">

  <label for="uid">UID</label>
  <input id="uid" type="text" autocomplete="username">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">

  <button id="loginBtn" class="btn">Login</button>

  <div id="msg" class="msg" role="alert"></div>

  <div class="small">No account? <a class="link" href="register.html">Register</a></div>
</div>

<script>
async function sha256Hex(message) {
  const enc = new TextEncoder();
  const data = enc.encode(message);
  const hash = await crypto.subtle.digest('SHA-256', data);
  const bytes = Array.from(new Uint8Array(hash));
  return bytes.map(b => b.toString(16).padStart(2,'0')).join('');
}
function loadUsers(){ try{ const r=localStorage.getItem('tf_users'); return r?JSON.parse(r):[] }catch(e){return[]}}
function showMsg(t,type='error'){ const el=document.getElementById('msg'); el.textContent=t; el.className='msg '+(type==='success'?'success':'error'); el.style.display='block' }

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const uid   = document.getElementById('uid').value.trim();
  const pass  = document.getElementById('password').value;

  if(!email || !uid || !pass){ showMsg('Please fill all fields'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showMsg('Invalid email'); return; }

  const users = loadUsers();
  const user = users.find(u => u.email === email && u.uid === uid);
  if(!user){ showMsg('Account not found'); return; }

  const passHash = await sha256Hex(pass);
  if(passHash !== user.passHash){ showMsg('Wrong password'); return; }

  // success: create a simple session object in localStorage
  localStorage.setItem('tf_session', JSON.stringify({ email: user.email, uid: user.uid, loggedAt: Date.now() }));

  showMsg('Login successful. Redirecting...', 'success');
  setTimeout(()=> { window.location.href = 'again.html'; }, 900);
});
</script>

</body>
</html>
